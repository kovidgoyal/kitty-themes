# vim:ft=kitty

## name: Twice
## author: ronmi (generated with Claude)
## license: MIT
## blurb: Unofficial fan-made dark theme based on TWICE logo and member
## colors on a warm dark-brown background. Every ANSI hue except black uses
## a member color (Chaeyoung, Jeongyeon, Jihyo, Tzuyu, Sana, Nayeon, Dahyun)
## in its normal or bright slot; marks use member-color fills. An optional
## custom tab bar using the logo gradient is available at
## https://gist.github.com/Ronmi/80653b64880cc75b7f2f9c845cdab3c9
## Not affiliated with or endorsed by JYP Entertainment.

#: The basic colors

foreground                      #EDE6DF
background                      #1A1512
selection_foreground            #1A1512
selection_background            #FF1F8E


#: Cursor colors

cursor                          #49C0EC
cursor_text_color               #1A1512


#: URL underline color when hovering with mouse

url_color                       #49C0EC


#: kitty window border colors and terminal bell colors

active_border_color             #FF1F8E
inactive_border_color           #6B5F55
bell_border_color               #F9CC85


#: Tab bar colors

active_tab_foreground           #1A1512
active_tab_background           #49C0EC
inactive_tab_foreground         #8A7F75
inactive_tab_background         #2A231E
tab_bar_background              #120E0C


#: Colors for marks (marked text in the terminal)
#: Ordered by attention: 1 low (Mina), 2 medium (Jihyo), 3 high (Chaeyoung)

